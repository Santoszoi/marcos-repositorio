name: Validate app and API
on:
  push:
    paths: ['secure-biometric-app/**', '.github/workflows/biometric-ci.yml']
  pull_request:
    paths: ['secure-biometric-app/**', '.github/workflows/biometric-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: secure-biometric-app
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: secure-biometric-app/backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: secure-biometric-app/backend
      - run: node --test scripts/native-config.test.mjs
      - run: npm test
        working-directory: secure-biometric-app/backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: secure-biometric-app/backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: node scripts/prepare.mjs
      - run: flutter analyze
        working-directory: secure-biometric-app/app
      - run: flutter test
        working-directory: secure-biometric-app/app
      - name: Build APK for testing
        run: flutter build apk --debug --dart-define=API_URL=https://example.invalid/
        working-directory: secure-biometric-app/app
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: secure-biometric-app/app/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: node scripts/prepare.mjs
      - run: flutter build ios --no-codesign --dart-define=API_URL=https://example.invalid/
        working-directory: secure-biometric-app/app
